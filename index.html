<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<script>
/* Framed inside the App Hub, the Hub's bar has already cleared the notch: see --padtop below.
   ?theme=light exists for the design look pass only; the app is dark like every app on this phone. */
try{if(window.top!==window.self)document.documentElement.classList.add("framed");}
catch(e){document.documentElement.classList.add("framed");}
if(/[?&]theme=light/.test(location.search))document.documentElement.setAttribute("data-theme","light");
</script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Paper Trader" />
<meta name="theme-color" content="#12161b" />
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
<title>Paper Trader</title>
<style>
/* Generated: design_geometry.py system --base 16 --ratio minor-third --unit 4 --seed #4a9eff
   Every value is derived. Change the command and regenerate; never hand-edit a number here.
   The seed is the Queue Board's blue, so the two boards on this phone read as one family. */
@layer tokens, base;
@layer tokens {
:root {
  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  --fs-xs: 0.6875rem; --lh-xs: 1.25rem; --tr-xs: 0.005em;
  --fs-sm: 0.8125rem; --lh-sm: 1.25rem; --tr-sm: -0.003em;
  --fs-base: 1rem; --lh-base: 1.5rem; --tr-base: -0.011em;
  --fs-lg: 1.1875rem; --lh-lg: 1.75rem; --tr-lg: -0.016em;
  --fs-xl: 1.4375rem; --lh-xl: 2rem; --tr-xl: -0.019em;
  --fs-5xl: 3rem; --lh-5xl: 3.5rem; --tr-5xl: -0.022em;
  --measure: 66ch;
  --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem; --space-6: 1.5rem; --space-8: 2rem; --space-12: 3rem;
  --rhythm: 1.5rem; --rhythm-2x: 3rem; --rhythm-half: 0.75rem;
  --radius-sm: 0.25rem; --radius-md: 0.5rem; --radius-lg: 1rem; --radius-pill: 9999px;
  --control-sm: 2rem; --control-md: 2.5rem; --control-lg: 3rem;
  --dur-2: 140ms; --dur-3: 200ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  color-scheme: light;
  --surface: #ffffff; --bg: #f7faff; --surface-2: #eef4fc; --border: #e1e6ee; --text: #20242a; --text-muted: #6b7077; --border-strong: #888d94; --primary: #4a9eff; --on-primary: #12161b; --primary-hover: #6cafff; --primary-soft: #e4f0ff; --primary-text: #0c6cc9; --focus: #0c6cc9; --danger: #c23e37; --danger-soft: #fdebe9; --warning: #996000; --warning-soft: #f6ede4; --success: #007d38; --success-soft: #e5f2e7;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #12161b; --surface: #1d2126; --surface-2: #252a2f; --border: #30353a; --text: #f9fcff; --text-muted: #8b9097; --border-strong: #6d7379; --primary: #4a9eff; --on-primary: #12161b; --primary-hover: #6cafff; --primary-soft: #1f3044; --primary-text: #4a9eff; --focus: #4a9eff; --danger: #f36b60; --danger-soft: #432828; --warning: #d18500; --warning-soft: #382d21; --success: #20ac54; --success-soft: #193427;
}
}
@layer base {
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-sans);
  font-size: var(--fs-base); line-height: var(--lh-base); letter-spacing: var(--tr-base);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
p { margin: 0; max-width: var(--measure); text-wrap: pretty; }
button, input, textarea { font: inherit; letter-spacing: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
}

/* ---- page frame ----------------------------------------------------------------------------------
   THE PAGE DOES NOT SCROLL; #scroll does, under a header that never moves. That keeps the day, its P/L
   and the slider in view while the day's operations scroll - and it avoids position:fixed, which iOS
   treats as absolute inside the App Hub's iframe (the Queue Board measured exactly that). */
:root { --padtop: max(var(--space-3), env(safe-area-inset-top)); --tap: var(--control-lg); }
html.framed { --padtop: var(--space-3); }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
body { display: flex; flex-direction: column; font-variant-numeric: tabular-nums; }
.col { width: 100%; max-width: 40rem; margin: 0 auto; padding-left: var(--space-4); padding-right: var(--space-4); }

header { flex: 0 0 auto; border-bottom: 1px solid var(--border); background: var(--bg); position: relative; }
header .col { padding-top: var(--padtop); padding-bottom: var(--space-2); }
#scroll { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; overscroll-behavior-y: contain; }
/* overflow-wrap on the whole column, not per element: an unbroken token in any session summary, note or
   rationale (a URL, a ticker list) otherwise spills past a 393 px screen without widening its own box. */
#scroll .col { padding-top: var(--space-6); padding-bottom: calc(var(--space-12) + env(safe-area-inset-bottom)); overflow-wrap: anywhere; }
.hide { display: none !important; }

/* The health light: green while the snapshot is fresh, amber when it is getting old, red when the PC has
   stopped publishing and the numbers on screen are history. Inset equally from the top and the right. */
#light { position: absolute; top: calc(var(--padtop) + var(--space-2)); right: var(--space-4);
  width: var(--space-2); height: var(--space-2); border-radius: var(--radius-pill);
  background: var(--success); box-shadow: 0 0 0 var(--space-1) var(--success-soft); }
#light.stale { background: var(--warning); box-shadow: 0 0 0 var(--space-1) var(--warning-soft); }
#light.dead { background: var(--danger); box-shadow: 0 0 0 var(--space-1) var(--danger-soft); }

/* ---- the day ------------------------------------------------------------------------------------- */
.dateline { display: flex; align-items: center; gap: var(--space-2); min-height: var(--lh-sm);
  font-size: var(--fs-sm); line-height: var(--lh-sm); letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text-muted); }
.chip { font-size: var(--fs-xs); line-height: var(--lh-xs); letter-spacing: 0.08em; text-transform: uppercase;
  padding: 0 var(--space-2); border-radius: var(--radius-pill); background: var(--primary-soft); color: var(--primary-text); }
#pl { font-size: var(--fs-5xl); line-height: var(--lh-5xl); letter-spacing: var(--tr-5xl); font-weight: 600;
  margin-top: var(--space-1); white-space: nowrap; }
.up { color: var(--success); } .down { color: var(--danger); } .flat { color: var(--text-muted); }
.subline { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-3); color: var(--text-muted);
  font-size: var(--fs-sm); line-height: var(--lh-sm); }
.subline b { font-weight: 600; }

/* The slider: a 48 px row so every part of it is a full touch target. */
.slider { display: flex; align-items: center; gap: var(--space-2); margin-top: var(--space-2); }
.step { flex: 0 0 auto; width: var(--tap); height: var(--tap); border-radius: var(--radius-md);
  border: 1px solid var(--border); background: var(--surface); font-size: var(--fs-xl); line-height: var(--lh-xl);
  padding: 0; cursor: pointer; }
.step:disabled { opacity: 0.4; cursor: default; }
input[type=range] { flex: 1 1 auto; min-width: 0; height: var(--tap); margin: 0; background: transparent;
  -webkit-appearance: none; appearance: none; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: var(--space-1); border-radius: var(--radius-pill); background: var(--border); }
input[type=range]::-moz-range-track { height: var(--space-1); border-radius: var(--radius-pill); background: var(--border); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: var(--space-6); height: var(--space-6);
  margin-top: calc((var(--space-1) - var(--space-6)) / 2); border-radius: var(--radius-pill);
  background: var(--primary); border: 0; }
input[type=range]::-moz-range-thumb { width: var(--space-6); height: var(--space-6); border-radius: var(--radius-pill);
  background: var(--primary); border: 0; }

/* ---- what happened ------------------------------------------------------------------------------- */
.err { background: var(--danger-soft); color: var(--danger); border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4); margin-bottom: var(--space-6); overflow-wrap: anywhere; }
section + section { margin-top: var(--space-8); }
h2 { display: flex; align-items: baseline; gap: var(--space-3); margin: 0 0 var(--space-3);
  font-size: var(--fs-sm); line-height: var(--lh-sm); letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; }
h2 span { font-weight: 400; color: var(--text-muted); letter-spacing: var(--tr-sm); text-transform: none; }
.summary { margin-bottom: var(--space-3); }
.muted { color: var(--text-muted); }
.small { font-size: var(--fs-sm); line-height: var(--lh-sm); letter-spacing: var(--tr-sm); }
.notes { margin: 0 0 var(--space-3); padding: 0; list-style: none; }
.notes li { position: relative; padding-left: var(--space-4); color: var(--text-muted);
  font-size: var(--fs-sm); line-height: var(--lh-sm); }
.notes li::before { content: "\2014"; position: absolute; left: 0; }
.notes li + li { margin-top: var(--space-1); }

.op { position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-md); padding: var(--space-3) var(--space-3) var(--space-3) var(--space-4); }
.op + .op { margin-top: var(--space-2); }
.op::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: var(--space-1); background: var(--primary); }
.op.sell::before { background: var(--border-strong); }
.op.refused::before, .op.rejected::before { background: var(--danger); }
.opline { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); flex-wrap: wrap; }
.opline > * { min-width: 0; }
.what { font-weight: 600; }
.st { font-size: var(--fs-sm); line-height: var(--lh-sm); color: var(--text-muted); white-space: nowrap; }
.st.pending { color: var(--warning); } .st.bad { color: var(--danger); }
.meta { color: var(--text-muted); font-size: var(--fs-sm); line-height: var(--lh-sm); }
.why { margin-top: var(--space-1); font-size: var(--fs-sm); line-height: var(--lh-sm); overflow-wrap: anywhere; }
.reasons { margin-top: var(--space-1); color: var(--danger); font-size: var(--fs-sm); line-height: var(--lh-sm); overflow-wrap: anywhere; }

footer { margin-top: var(--space-12); padding-top: var(--space-4); border-top: 1px solid var(--border);
  display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-4); color: var(--text-muted);
  font-size: var(--fs-sm); line-height: var(--lh-sm); }
footer a { color: var(--text-muted); margin-left: auto; }

/* ---- pairing (phone only) ------------------------------------------------------------------------ */
#pair, #handoff { padding-top: var(--space-6); }
#pair h1, #handoff h1 { margin: 0 0 var(--space-4); font-size: var(--fs-xl); line-height: var(--lh-xl); letter-spacing: var(--tr-xl); font-weight: 600; }
textarea { width: 100%; min-height: calc(var(--space-12) * 2); padding: var(--space-3); border-radius: var(--radius-md);
  border: 1px solid var(--border-strong); background: var(--surface); font-family: var(--font-mono);
  font-size: var(--fs-base); line-height: var(--lh-base); resize: vertical; }
.btns { display: flex; gap: var(--space-2); margin-top: var(--space-3); }
.btn { height: var(--tap); padding: 0 var(--space-6); border-radius: var(--radius-md); border: 1px solid var(--border);
  background: var(--surface); cursor: pointer; font-weight: 600; }
.btn.p { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.msg { margin-top: var(--space-3); min-height: var(--lh-base); }
.msg.bad { color: var(--danger); }
</style>
</head>
<body>

<header id="head" class="hide">
  <div class="col">
    <div class="dateline"><span id="date"></span><span id="live" class="chip hide">live</span></div>
    <div id="pl" class="flat">&nbsp;</div>
    <div class="subline"><span id="pct"></span><span id="eq"></span></div>
    <div class="slider">
      <button class="step" id="prev" aria-label="Previous day">&#8249;</button>
      <input type="range" id="day" min="0" max="0" value="0" step="1" aria-label="Day" />
      <button class="step" id="next" aria-label="Next day">&#8250;</button>
    </div>
  </div>
  <div id="light" class="hide"></div>
</header>

<div id="scroll">
  <div class="col">
    <section id="pair" class="hide">
      <h1>Paper Trader</h1>
      <textarea id="pairIn" placeholder="pt1.&hellip;" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
      <div class="btns"><button class="btn p" id="pairGo">Pair</button><button class="btn" id="pairPaste">Paste</button></div>
      <div id="pairMsg" class="msg bad"></div>
    </section>

    <!-- Opened from the pairing QR. A home-screen app keeps its own storage, separate from Safari's, so
         pairing in Safari would key a copy nobody opens: this screen only hands the code to the clipboard,
         and the paste happens inside the App Hub. -->
    <section id="handoff" class="hide">
      <h1>Pairing code</h1>
      <textarea id="hoCode" readonly autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
      <div class="btns"><button class="btn p" id="hoCopy">Copy code</button><button class="btn" id="hoHere">Pair here</button></div>
      <div id="hoMsg" class="msg"></div>
    </section>

    <main id="app" class="hide">
      <div id="err" class="err hide"></div>
      <div id="body"></div>
      <footer><span id="age"></span><span id="total"></span><a href="#" id="unpair">Unpair</a></footer>
    </main>
  </div>
</div>

<script>
"use strict";
var LS = "paper_trader_v1";
var POLL_MS = 60000;   /* the PC refreshes every 15 min and the gist CDN adds ~1 min; faster polling buys nothing */
var DESKTOP = !!(window.chrome && window.chrome.webview);
var SELFTEST = /[?&]selftest/.test(location.search);
var FIXTURE = (location.search.match(/[?&]fixture=([\w.\-\/]+)/) || [])[1];   /* relative paths only */

function el(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
  return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

/* ---- formatting -------------------------------------------------------------------------------- */
var USD = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", signDisplay: "exceptZero" });
var USD0 = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" });
var PCT = new Intl.NumberFormat("en-US", { style: "percent", signDisplay: "exceptZero", minimumFractionDigits: 2, maximumFractionDigits: 2 });
function minus(s) { return s.replace("-", "−"); }
function money(v) { return v == null ? "—" : minus(USD.format(v)); }
function pct(v) { return v == null ? "" : minus(PCT.format(v / 100)); }
function dayLabel(d) {
  return new Date(d + "T12:00:00Z").toLocaleDateString("en-GB",
    { weekday: "short", day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
}
function hm(iso) { return iso ? new Date(iso).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }) : ""; }
function qty(v) { return v == null ? "" : (Math.round(v * 1e4) / 1e4).toString(); }
function signClass(v) { return v == null || v === 0 ? "flat" : v > 0 ? "up" : "down"; }
var PHASE = { "pre-open": "Pre-open", "pre-close": "Pre-close" };
var STRAT = { momentum: "momentum", mean_reversion: "mean reversion", risk: "stop-loss", discretionary: "discretionary" };
var TIF = { opg: "open auction", cls: "close auction", day: "day" };

/* ---- crypto: the phone half of tools/queue-board-web's envelope, shared byte for byte -------------
   The PC appends the 16-byte GCM tag to the ciphertext, which is the layout crypto.subtle.decrypt wants.
   `z:"gzip"`: the plaintext was gzipped before encryption, the only place compression can happen.
   tests/selftest.py lifts this block out and runs it under node against Python's encryption. */
/* <crypto> */
function b64bytes(b64) {
  var bin = atob(b64), a = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return a;
}
function decryptPayload(cfg, doc) {
  return crypto.subtle.importKey("raw", b64bytes(cfg.key), { name: "AES-GCM" }, false, ["decrypt"])
    .then(function (k) { return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64bytes(doc.iv) }, k, b64bytes(doc.ct)); })
    .then(function (buf) {
      if (doc.z !== "gzip") return new TextDecoder().decode(buf);
      return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    })
    .then(JSON.parse);
}
/* </crypto> */
function parsePair(str) {
  str = (str || "").trim();
  if (str.indexOf("pt1.") !== 0) throw new Error("not a Paper Trader pairing code");
  var raw = atob(str.slice(4)), cut = raw.lastIndexOf("|");
  if (cut < 0) throw new Error("pairing code is incomplete");
  var url = raw.slice(0, cut), key = raw.slice(cut + 1);
  if (!/^https:\/\//.test(url)) throw new Error("pairing code carries no https address");
  if (b64bytes(key).length !== 32) throw new Error("pairing code carries no 256-bit key");
  return { url: url, key: key };
}
function cfgLoad() { try { return JSON.parse(localStorage.getItem(LS)) || null; } catch (e) { return null; } }
function cfgSave(c) { try { localStorage.setItem(LS, JSON.stringify(c)); return true; } catch (e) { return false; } }

/* ---- state ------------------------------------------------------------------------------------- */
var snap = null, idx = -1, followLatest = true, lastErr = "";

function setSnap(s) {
  var prevDate = snap && snap.days[idx] ? snap.days[idx].date : null;
  snap = s;
  var n = snap.days.length;
  el("day").max = Math.max(0, n - 1);
  if (followLatest || prevDate == null) idx = n - 1;
  else {
    idx = n - 1;
    for (var i = 0; i < n; i++) if (snap.days[i].date === prevDate) { idx = i; break; }
  }
  render();
}

function go(i) {
  if (!snap || !snap.days.length) return;
  idx = Math.max(0, Math.min(snap.days.length - 1, i));
  followLatest = idx === snap.days.length - 1;
  render();
}

/* ---- render ------------------------------------------------------------------------------------ */
function opHtml(o) {
  var side = o.side === "sell" ? "sell" : "buy";
  var cls = "op " + side + (o.status === "refused" || o.status === "rejected" ? " " + o.status : "");
  var st, stc = "";
  if (o.status === "refused") { st = "refused"; stc = "bad"; }
  else if (o.status === "rejected") { st = "rejected by Alpaca"; stc = "bad"; }
  else if (o.filled > 0 && o.price != null) {
    st = (o.qty != null && o.filled < o.qty ? qty(o.filled) + "/" + qty(o.qty) + " " : "") + "filled @ " + USD0.format(o.price);
  } else if (/^(new|accepted|pending_new|accepted_for_bidding|held|pending_replace)$/.test(o.status)) { st = "pending"; stc = "pending"; }
  else st = (o.status || "").replace(/_/g, " ");
  var meta = [o.src === "manual" ? "manual" : (STRAT[o.strategy] || o.strategy), TIF[o.tif] || o.tif, hm(o.t)]
    .filter(Boolean).join(" · ");
  var h = '<div class="' + cls + '"><div class="opline"><span class="what">' + esc(side.toUpperCase() + " " + qty(o.qty) + " " + o.sym)
    + '</span><span class="st ' + stc + '">' + esc(st) + "</span></div>"
    + '<div class="meta">' + esc(meta) + "</div>";
  if (o.why) h += '<p class="why">' + esc(o.why) + "</p>";
  if (o.reasons && o.reasons.length) h += '<p class="reasons">' + esc(o.reasons.join("; ")) + "</p>";
  return h + "</div>";
}

function dayHtml(d) {
  var h = "", used = {};
  var phases = {};
  (d.sessions || []).forEach(function (s) { phases[s.phase] = true; });
  var blocks = (d.sessions || []).map(function (s) { return { s: s, t: s.start || s.end }; })
    .concat((d.skips || []).filter(function (k) { return !phases[k.phase]; }).map(function (k) { return { k: k, t: k.t }; }))
    .sort(function (a, b) { return (a.t || "") < (b.t || "") ? -1 : 1; });
  blocks.forEach(function (b) {
    if (b.k) {
      h += "<section><h2>" + esc(PHASE[b.k.phase] || b.k.phase) + "<span>skipped · " + esc(b.k.reason) + "</span></h2></section>";
      return;
    }
    var s = b.s, ops = d.ops.filter(function (o) { return o.session === s.id; });
    ops.forEach(function (o) { used[d.ops.indexOf(o)] = true; });
    h += "<section><h2>" + esc(PHASE[s.phase] || s.phase) + "<span>" + esc(hm(s.start)) + "</span></h2>";
    if (s.summary) h += '<p class="summary' + (s.abandoned ? " muted" : "") + '">' + esc(s.summary) + "</p>";
    if (s.notes && s.notes.length) h += '<ul class="notes">' + s.notes.map(function (n) { return "<li>" + esc(n.text) + "</li>"; }).join("") + "</ul>";
    h += ops.map(opHtml).join("") + "</section>";
  });
  var rest = d.ops.filter(function (o, i) { return !used[i]; });
  if (rest.length) h += "<section><h2>Other orders</h2>" + rest.map(opHtml).join("") + "</section>";
  return h;
}

function age() { return snap ? (Date.now() - Date.parse(snap.t)) / 1000 : Infinity; }
function ago(sec) {
  if (sec < 90) return "just now";
  if (sec < 5400) return Math.round(sec / 60) + " min ago";
  if (sec < 172800) return Math.round(sec / 3600) + " h ago";
  return Math.round(sec / 86400) + " days ago";
}
function paintAge() {
  var a = age(), L = el("light");
  L.classList.remove("hide", "stale", "dead");
  /* The PC refreshes every 15 minutes. Two missed refreshes is a warning; three hours means it is off. */
  if (a > 3 * 3600) L.classList.add("dead"); else if (a > 35 * 60) L.classList.add("stale");
  el("age").textContent = snap ? "updated " + ago(a) : "";
}

function render() {
  var err = (snap && snap.error) || lastErr;
  el("err").textContent = err || "";
  el("err").classList.toggle("hide", !err);
  el("app").classList.remove("hide");
  if (!snap) return;   /* nothing ever arrived: the error line alone says why */
  el("head").classList.remove("hide");
  var d = snap.days[idx];
  el("day").value = idx;
  el("prev").disabled = idx <= 0;
  el("next").disabled = idx >= snap.days.length - 1;
  if (!d) {
    el("date").textContent = ""; el("pl").textContent = "—"; el("pl").className = "flat";
    el("pct").textContent = ""; el("eq").textContent = ""; el("body").innerHTML = "";
  } else {
    el("date").textContent = dayLabel(d.date);
    el("live").classList.toggle("hide", d.final !== false);
    el("pl").textContent = money(d.pl);
    el("pl").className = signClass(d.pl);
    el("pct").textContent = pct(d.pl_pct);
    el("eq").textContent = d.equity != null ? "equity " + USD0.format(d.equity) : "";
    el("body").innerHTML = dayHtml(d);
  }
  var acc = snap.account;
  el("total").innerHTML = acc ? 'since start <b class="' + signClass(acc.since_start) + '">' + esc(money(acc.since_start)) + "</b>" : "";
  el("unpair").classList.toggle("hide", DESKTOP || !!FIXTURE);
  paintAge();
}

/* ---- data sources ------------------------------------------------------------------------------ */
var cfg = null, polling = false;
function poll() {
  if (polling || !cfg) return;
  polling = true;
  /* The cache-buster is load-bearing: the gist CDN sends max-age=300 and keys on the path. */
  fetch(cfg.url + "?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (doc) { if (!doc || !doc.ct) throw new Error("nothing published yet"); return decryptPayload(cfg, doc); })
    .then(function (s) {
      lastErr = "";
      try { localStorage.setItem(LS + "_last", JSON.stringify(s)); } catch (e) {}
      setSnap(s);
      if (SELFTEST) verdict(true, "decrypted " + s.days.length + " day(s)");
    })
    .catch(function (e) { lastErr = "cannot read the snapshot: " + e.message; render(); if (SELFTEST) verdict(false, lastErr); })
    .then(function () { polling = false; });
}
function startWeb(c) {
  cfg = c;
  el("pair").classList.add("hide");
  /* Paint the last snapshot at once, so a cold launch offline shows the board it had - with its age. */
  try { var last = JSON.parse(localStorage.getItem(LS + "_last")); if (last && last.days) setSnap(last); } catch (e) {}
  poll();
  if (SELFTEST) return;
  setInterval(poll, POLL_MS);
  setInterval(paintAge, 30000);
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") poll(); });
}

/* ?selftest=1 with ?fixture=: walk every day and assert what the user asked for - the latest day first, gains
   green with "+", losses red with "−" - and that nothing leaves a phone-width viewport. Three measurements,
   each blind to the others' case: boxes past the right edge, text clipped inside an overflow:hidden card,
   and the scroller itself scrolling sideways. Run it inside a 393 px iframe: headless Chrome keeps a
   minimum window width above a phone's, so --window-size=393 lays the page out wider and passes a page
   that overflows (the Queue Board learned that from a screenshot). */
function overflow() {
  var W = document.documentElement.clientWidth, out = [];
  document.querySelectorAll("body *").forEach(function (n) {
    var r = n.getBoundingClientRect();
    var name = n.tagName.toLowerCase() + (n.id ? "#" + n.id : "") + (n.className && typeof n.className === "string" ? "." + n.className.split(" ")[0] : "");
    if (r.width && r.right > W + 0.5) out.push(name + " ends at " + Math.round(r.right) + " > " + W);
    if ((n.classList.contains("op") || n.id === "pl") && n.scrollWidth > n.clientWidth + 1) out.push(name + " clips its text");
  });
  var s = el("scroll");
  if (s.scrollWidth > s.clientWidth + 1) out.push("#scroll scrolls sideways");
  return out;
}
function selfCheck() {
  var bad = [];
  if (idx !== snap.days.length - 1) bad.push("opened on day " + idx + ", not the latest");
  for (var i = 0; i < snap.days.length; i++) {
    go(i);
    var d = snap.days[i], p = el("pl");
    if (d.pl > 0 && (p.className !== "up" || p.textContent.charAt(0) !== "+")) bad.push(d.date + " gain not green with +");
    if (d.pl < 0 && (p.className !== "down" || p.textContent.charAt(0) !== "−")) bad.push(d.date + " loss not red with −");
    if (el("date").textContent.indexOf(String(+d.date.slice(8))) < 0) bad.push(d.date + " date label is " + el("date").textContent);
    bad = bad.concat(overflow().map(function (s) { return d.date + ": " + s; }));
  }
  go(snap.days.length - 1);
  return bad;
}

function verdict(ok, msg) {
  var v = document.createElement("div");
  v.id = "verdict"; v.textContent = (ok ? "PASS " : "FAIL ") + msg;
  document.body.appendChild(v);
}

/* ---- input ------------------------------------------------------------------------------------- */
el("day").addEventListener("input", function () { go(+this.value); });
el("prev").addEventListener("click", function () { go(idx - 1); });
el("next").addEventListener("click", function () { go(idx + 1); });
document.addEventListener("keydown", function (e) {
  if (DESKTOP && (e.key === "F5" || (e.ctrlKey && e.key === "r"))) {
    e.preventDefault(); window.chrome.webview.postMessage("refresh"); return;   /* the host re-reads Alpaca */
  }
  if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.key === "ArrowLeft") go(idx - 1);
  else if (e.key === "ArrowRight") go(idx + 1);
  else if (e.key === "Home") go(0);
  else if (e.key === "End") go(Infinity);
});
el("pairGo").addEventListener("click", function () {
  try {
    var c = parsePair(el("pairIn").value);
    if (!cfgSave(c)) { el("pairMsg").textContent = "this browser refuses to store the key"; return; }
    el("pairMsg").textContent = ""; startWeb(c);
  } catch (e) { el("pairMsg").textContent = e.message; }
});
el("pairPaste").addEventListener("click", function () {
  if (!(navigator.clipboard && navigator.clipboard.readText)) { el("pairMsg").textContent = "paste is not available here"; return; }
  navigator.clipboard.readText().then(function (t) { el("pairIn").value = (t || "").trim(); el("pairMsg").textContent = ""; },
    function () { el("pairMsg").textContent = "paste was refused"; });
});
el("hoCopy").addEventListener("click", function () {
  var t = el("hoCode");
  function legacy() {
    t.focus(); t.setSelectionRange(0, t.value.length);
    var ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
    el("hoMsg").textContent = ok ? "copied" : "copy failed";
  }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t.value).then(function () { el("hoMsg").textContent = "copied"; }, legacy);
  else legacy();
});
el("hoHere").addEventListener("click", function () {
  try { var c = parsePair(el("hoCode").value); if (cfgSave(c)) { el("handoff").classList.add("hide"); startWeb(c); } }
  catch (e) { el("hoMsg").textContent = e.message; }
});
el("unpair").addEventListener("click", function (ev) {
  ev.preventDefault();
  try { localStorage.removeItem(LS); localStorage.removeItem(LS + "_last"); } catch (e) {}
  location.reload();
});

/* ---- boot -------------------------------------------------------------------------------------- */
(function () {
  if (DESKTOP) {
    /* The desktop window (desktop/PaperTrader.cs) reads the snapshot from disk and posts it here whenever
       the file changes, so the same page draws the same data with no network and no key. */
    window.chrome.webview.addEventListener("message", function (e) {
      try { lastErr = ""; setSnap(typeof e.data === "string" ? JSON.parse(e.data) : e.data); }
      catch (x) { lastErr = "unreadable snapshot: " + x.message; render(); }
    });
    window.chrome.webview.postMessage("ready");
    setInterval(paintAge, 30000);
    return;
  }
  if (FIXTURE) {
    fetch(FIXTURE, { cache: "no-store" }).then(function (r) { return r.json(); })
      .then(function (s) {
        setSnap(s);
        var want = (location.search.match(/[?&]day=(\d+)/) || [])[1];   /* look-pass screenshots only */
        if (want != null) go(+want);
        if (!SELFTEST) return;
        var bad = selfCheck();
        verdict(!bad.length, bad.length ? bad.join(" | ") : "fixture: " + s.days.length + " days, no overflow");
      })
      .catch(function (e) { if (SELFTEST) verdict(false, e.message); });
    return;
  }
  /* A code in the URL FRAGMENT is how the QR reaches this page; the fragment is never sent to a server.
     It is stripped from the address bar at once, and it does not pair: see #handoff. */
  var frag = location.hash || "";
  if (frag.indexOf("#pt1.") === 0) {
    var code = frag.slice(1);
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
    try { parsePair(code); el("hoCode").value = code; el("handoff").classList.remove("hide"); }
    catch (e) { el("pairMsg").textContent = e.message; el("pair").classList.remove("hide"); }
    return;
  }
  var c = cfgLoad();
  if (c && c.url && c.key) startWeb(c);
  else el("pair").classList.remove("hide");
})();
</script>

<script>if ("serviceWorker" in navigator && !(window.chrome && window.chrome.webview)) { navigator.serviceWorker.register("sw.js").catch(function () {}); }</script>

(function () {

  if (BUILD.indexOf("APP_BUILD") > -1) return;
  var busy = false;
  function check() {
    if (busy || document.visibilityState !== "visible" || !navigator.onLine) return;
    busy = true;
    fetch("./?_au=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.ok ? r.text() : null; })
      .then(function (t) {

          if (m && m[1] !== BUILD && m[1].indexOf("APP_BUILD") < 0) { location.reload(); return; } }
        busy = false;
      })
      .catch(function () { busy = false; });
  }
  document.addEventListener("visibilitychange", check);
  window.addEventListener("pageshow", check);
  window.addEventListener("focus", check);
})();
</script>
